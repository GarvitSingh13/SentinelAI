services:
  postgres:
    image: postgres:16-alpine
    container_name: sentinelai-postgres
    restart: always
    environment:
      POSTGRES_DB: sentinelai
      POSTGRES_USER: sentinelai
      POSTGRES_PASSWORD: sentinelai_secret
    ports:
      - "5434:5432"
    volumes:
      - sentinelai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelai -d sentinelai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: sentinelai-redis
    restart: always
    ports:
      - "6381:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.11
    container_name: sentinelai-redpanda
    restart: always
    command:
      - redpanda
      - start
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:9093
      - --advertise-kafka-addr internal://redpanda:9092,external://localhost:9093
    ports:
      - "9093:9093"
      - "9644:9644"

volumes:
  sentinelai_pgdata:
    driver: local
